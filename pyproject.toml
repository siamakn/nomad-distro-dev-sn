[project]
name = "nomad-distribution"
description = "nomad distribution template"
version = "0.1"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "fairmat-events-form",
    "fairmat-members",
    "fairmat-network-projects",
    "fairmat-onboarding",
    "fairmat-project-outputs",
    "nomad-bayesian-optimization[parsing,actions]",
    "nomad-gui==2.0.0",
    "nomad-lab[infrastructure]>=2.0.0",
    "nomad-oasis-customizer-toolkit",
    "nomad-training-resources",
    "torch",  # listed only so the CPU-only source below applies (see tool.uv.sources)
]

[tool.uv.workspace]
members = ["packages/*", "packages/fairmat-network-projects/fairmat-network-projects"]
# fairmat-network-projects ships its pyproject.toml one folder deeper (the template's
# move_template_files.sh step was never run upstream), so only the nested folder is a member.
exclude = ["packages/fairmat-network-projects"]

[tool.uv.sources]
nomad-lab = { workspace = true }
nomad-training-resources = { workspace = true }
fairmat-events-form = { workspace = true }
fairmat-onboarding = { workspace = true }
fairmat-members = { workspace = true }
fairmat-network-projects = { workspace = true }
fairmat-project-outputs = { workspace = true }
nomad-bayesian-optimization = { workspace = true }
nomad-oasis-customizer-toolkit = { workspace = true }
# torch comes in via baybe (nomad-bayesian-optimization); this machine has no NVIDIA GPU,
# so take the CPU-only wheel instead of ~3 GB of CUDA libraries.
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
extra-index-url = [
  "https://gitlab.mpcdf.mpg.de/api/v4/projects/2187/packages/pypi/simple",
]
required-version = ">=0.5.14"
constraint-dependencies = ["flatdict>=4.1.0"]
# fairmat-project-outputs still carries the plugin-template pin mkdocs-material==8.1.1,
# which conflicts with the >=9.5 required by the other four plugins docs extras.
override-dependencies = ["mkdocs-material>=9.5"]

[dependency-groups]
dev = ["nomad-lab[infrastructure, dev]>=1.3.4", "poethepoet>=0.37.0"]

[tool.poe.tasks]
submodule = "git submodule update --init --recursive"
docker = "docker compose up -d"
setup = ["docker", "config"]
lint = ["ruff-lint", "ruff-format"]

[tool.poe.tasks.start]
cmd = "nomad admin run appworker --dev"
deps = ["start-info"]
env = { NOMAD_SERVICES_MODE = "development" }

[tool.poe.tasks.start-info]
cmd = "python -c \"print('NOMAD GUI: http://localhost:8000/nomad-oasis/gui/v2/')\""
verbosity = -1

[tool.poe.tasks.cpuworker]
cmd = "nomad admin run action-cpu-worker"
env = { NOMAD_SERVICES_MODE = "development" }

[tool.poe.tasks.gpuworker]
cmd = "nomad admin run action-gpu-worker"
env = { NOMAD_SERVICES_MODE = "development" }

[tool.poe.tasks.config]
shell = """
import os;
if not os.path.exists("nomad.yaml"):
    with open("nomad.yaml", "w") as f:
        f.write("keycloak:\\n  realm_name: \\"fairdi_nomad_test\\"\\n")
"""
interpreter = "python"

[tool.poe.tasks.gui-env]
cmd = "python -W ignore -m nomad.cli dev gui-env"
capture_stdout = "packages/nomad-FAIR/gui/.env.development"

[tool.poe.tasks.docs]
cmd = "mkdocs serve -a localhost:8001"
cwd = "packages/nomad-docs"

[tool.poe.tasks.ruff-lint]
cmd = "ruff check ."

[tool.poe.tasks.ruff-format]
cmd = "ruff format . --check"

[tool.poe.tasks.hub]
cmd = "nomad admin run hub"
cwd = "packages/nomad-FAIR"

[tool.poe.tasks.gui]
control.expr = "sys.platform"
args = [{ name = "script", positional = true, default = "start" }]

[[tool.poe.tasks.gui.switch]]
case = "win32"
cmd = "yarn.cmd run ${script}"
cwd = "packages/nomad-FAIR/gui"

[[tool.poe.tasks.gui.switch]]
cmd = "yarn run ${script}"
cwd = "packages/nomad-FAIR/gui"

[tool.poe.tasks.gui-setup]
sequence = ["gui-env", "gui-install"]

[tool.poe.tasks.gui-install]
control.expr = "sys.platform"

[[tool.poe.tasks.gui-install.switch]]
case = "win32"
cmd = "yarn.cmd"
cwd = "packages/nomad-FAIR/gui"

[[tool.poe.tasks.gui-install.switch]]
cmd = "yarn"
cwd = "packages/nomad-FAIR/gui"

[tool.poe.tasks.gen-gui-test-env]
cmd = "python -W ignore -m nomad.cli dev gui-config"
capture_stdout = "packages/nomad-FAIR/gui/tests/env.js"
env = { NOMAD_CONFIG = "packages/nomad-FAIR/gui/tests/nomad.yaml" }

[tool.poe.tasks.gen-nomad-lock]
cmd = "uv pip compile -U --universal -p 3.11 --extra infrastructure --extra dev --annotation-style=line pyproject.toml requirements.txt"
capture_stdout = "packages/nomad-FAIR/requirements-dev.txt"
cwd = "packages/nomad-FAIR"
deps = ["gen-nomad-lock-without-dev"]

[tool.poe.tasks.gen-nomad-lock-without-dev]
cmd = "uv pip compile -U --universal -p 3.11 --extra infrastructure --annotation-style=line pyproject.toml"
cwd = "packages/nomad-FAIR"
capture_stdout = "packages/nomad-FAIR/requirements.txt"
